name: Build GhostDrive & Agents

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip cache purge
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pyinstaller

      - name: Build Windows
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: |
          pyinstaller --noconfirm --clean GhostDrive.spec
          pyinstaller --noconfirm --clean GhostDriveAgents.spec

      - name: Compress
        run: |
          Compress-Archive -Path dist/GhostDrive -DestinationPath GhostDrive-Windows.zip
          Compress-Archive -Path dist/GhostDriveAgents -DestinationPath GhostDriveAgents-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GhostDrive-Windows
          path: GhostDrive-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GhostDriveAgents-Windows
          path: GhostDriveAgents-Windows.zip

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies via direct wheel download
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          
          # 1. Download Torch wheel directly via curl and install locally
          curl -L -o torch-2.15.0-cp312-cp312-macosx_14_0_arm64.whl https://download.pytorch.org/whl/cpu/torch-2.15.0-cp312-cp312-macosx_14_0_arm64.whl
          pip install --no-cache-dir torch-2.15.0-cp312-cp312-macosx_14_0_arm64.whl
          
          # 2. Download Llama-cpp-python wheel directly via curl and install locally
          curl -L -o llama_cpp_python-0.3.36-py3-none-macosx_11_0_arm64.whl https://abetlen.github.io/llama-cpp-python/whl/cpu/llama_cpp_python-0.3.36-py3-none-macosx_11_0_arm64.whl
          pip install --no-cache-dir llama_cpp_python-0.3.36-py3-none-macosx_11_0_arm64.whl
          
          # 3. Install remaining requirements and PyInstaller
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pyinstaller

      - name: Build Mac
        run: |
          source venv/bin/activate
          pyinstaller --noconfirm --clean GhostDrive.spec
          pyinstaller --noconfirm --clean GhostDriveAgents.spec

      - name: Compress
        run: |
          zip -r GhostDrive-macOS.zip dist/GhostDrive.app
          zip -r GhostDriveAgents-macOS.zip dist/GhostDriveAgents.app

      - uses: actions/upload-artifact@v4
        with:
          name: GhostDrive-macOS
          path: GhostDrive-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GhostDriveAgents-macOS
          path: GhostDriveAgents-macOS.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip cache purge
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pyinstaller

      - name: Build
        run: |
          pyinstaller --noconfirm --clean GhostDrive.spec
          pyinstaller --noconfirm --clean GhostDriveAgents.spec

      - name: Compress
        run: |
          tar -czvf GhostDrive-Linux.tar.gz -C dist GhostDrive
          tar -czvf GhostDriveAgents-Linux.tar.gz -C dist GhostDriveAgents

      - uses: actions/upload-artifact@v4
        with:
          name: GhostDrive-Linux
          path: GhostDrive-Linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: GhostDriveAgents-Linux
          path: GhostDriveAgents-Linux.tar.gz
