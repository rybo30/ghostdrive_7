name: Build GhostDrive & Agents

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: |
          pyinstaller --noconfirm --clean GhostDrive.spec
          pyinstaller --noconfirm --clean GhostDriveAgents.spec

      - name: Compress
        run: |
          Compress-Archive -Path dist/GhostDrive -DestinationPath GhostDrive-Windows.zip
          Compress-Archive -Path dist/GhostDriveAgents -DestinationPath GhostDriveAgents-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GhostDrive-Windows
          path: GhostDrive-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GhostDriveAgents-Windows
          path: GhostDriveAgents-Windows.zip

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip cache purge
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          
          # Use --prefer-binary to avoid full source-tree bloat while avoiding CRC lockups
          pip install llama-cpp-python --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/metal
          
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Purge Source Build Bloat from Site-Packages
        run: |
          python -c "
          import site, os, shutil
          for site_dir in site.getsitepackages():
              llama_dir = os.path.join(site_dir, 'llama_cpp')
              if os.path.exists(llama_dir):
                  print(f'Pruning build trash in {llama_dir}')
                  for root, dirs, files in os.walk(llama_dir):
                      for f in files:
                          if f.endswith(('.a', '.h', '.cpp', '.cmake', '.txt', '.o')):
                              try:
                                  os.remove(os.path.join(root, f))
                              except:
                                  pass
                      for d in dirs:
                          if d in ('CMakeFiles', 'include', 'src', 'ggml-src', 'build'):
                              shutil.rmtree(os.path.join(root, d), ignore_errors=True)
          "

      - name: Build Mac
        run: |
          pyinstaller --noconfirm --clean GhostDrive.spec
          pyinstaller --noconfirm --clean GhostDriveAgents.spec

      - name: Strip Debug Symbols and Prune Bloat
        run: |
          echo "Stripping debug symbols from all dylibs, sos, and executables..."
          find dist/GhostDrive.app -name "*.dylib" -exec strip -x {} \; 2>/dev/null || true
          find dist/GhostDrive.app -name "*.so" -exec strip -x {} \; 2>/dev/null || true
          find dist/GhostDrive.app -type f -perm +111 -exec strip -x {} \; 2>/dev/null || true

          find dist/GhostDriveAgents.app -name "*.dylib" -exec strip -x {} \; 2>/dev/null || true
          find dist/GhostDriveAgents.app -name "*.so" -exec strip -x {} \; 2>/dev/null || true
          find dist/GhostDriveAgents.app -type f -perm +111 -exec strip -x {} \; 2>/dev/null || true

          echo "Removing heavy unused framework assets..."
          rm -rf dist/GhostDrive.app/Contents/Resources/PySide6/translations
          rm -rf dist/GhostDriveAgents.app/Contents/Resources/PySide6/translations

      - name: Compress
        run: |
          # Purge unused byte-code and cache junk
          find dist/GhostDrive.app -name "*.pyc" -delete
          find dist/GhostDrive.app -name "__pycache__" -type d -exec rm -rf {} +
          find dist/GhostDriveAgents.app -name "*.pyc" -delete
          find dist/GhostDriveAgents.app -name "__pycache__" -type d -exec rm -rf {} +
          
          # Compress archives with maximum compression
          zip -9 -r GhostDrive-macOS.zip dist/GhostDrive.app
          zip -9 -r GhostDriveAgents-macOS.zip dist/GhostDriveAgents.app

      - uses: actions/upload-artifact@v4
        with:
          name: GhostDrive-macOS
          path: GhostDrive-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GhostDriveAgents-macOS
          path: GhostDriveAgents-macOS.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller --noconfirm --clean GhostDrive.spec
          pyinstaller --noconfirm --clean GhostDriveAgents.spec

      - name: Compress
        run: |
          tar -czvf GhostDrive-Linux.tar.gz -C dist GhostDrive
          tar -czvf GhostDriveAgents-Linux.tar.gz -C dist GhostDriveAgents

      - uses: actions/upload-artifact@v4
        with:
          name: GhostDrive-Linux
          path: GhostDrive-Linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: GhostDriveAgents-Linux
          path: GhostDriveAgents-Linux.tar.gz
