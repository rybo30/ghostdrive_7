name: Build GhostDrive & Agents

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: |
          pyinstaller --noconfirm --clean GhostDrive.spec
          pyinstaller --noconfirm --clean GhostDriveAgents.spec

      - name: Compress Windows Artifacts
        run: |
          New-Item -ItemType Directory -Force -Path Windows
          Copy-Item -Recurse -Force dist/GhostDrive/* Windows/
          Compress-Archive -Path Windows -DestinationPath Windows.zip

          New-Item -ItemType Directory -Force -Path Windows-Agents
          Copy-Item -Recurse -Force dist/GhostDriveAgents/* Windows-Agents/
          Compress-Archive -Path Windows-Agents -DestinationPath Windows-Agents.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Agents
          path: Windows-Agents.zip

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          
          # Force source compilation to bypass wheel CRC corruption errors on Mac
          pip install --no-cache-dir --no-binary=llama-cpp-python llama-cpp-python
          
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Mac
        run: |
          pyinstaller --noconfirm --clean GhostDrive.spec
          pyinstaller --noconfirm --clean GhostDriveAgents.spec

      - name: Compress Mac Artifacts
        run: |
          mkdir -p Mac
          cp -R dist/GhostDrive.app Mac/
          zip -r Mac.zip Mac

          mkdir -p Mac-Agents
          cp -R dist/GhostDriveAgents.app Mac-Agents/
          zip -r Mac-Agents.zip Mac-Agents

      - uses: actions/upload-artifact@v4
        with:
          name: Mac
          path: Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Mac-Agents
          path: Mac-Agents.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller --noconfirm --clean GhostDrive.spec
          pyinstaller --noconfirm --clean GhostDriveAgents.spec

      - name: Compress Linux Artifacts
        run: |
          mkdir -p Linux
          cp -r dist/GhostDrive/* Linux/
          tar -czvf Linux.tar.gz Linux

          mkdir -p Linux-Agents
          cp -r dist/GhostDriveAgents/* Linux-Agents/
          tar -czvf Linux-Agents.tar.gz Linux-Agents

      - uses: actions/upload-artifact@v4
        with:
          name: Linux
          path: Linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-Agents
          path: Linux-Agents.tar.gz
