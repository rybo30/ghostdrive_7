name: Build GhostDrive & Agents

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Main GhostDrive
        run: pyinstaller --noconfirm --clean GhostDrive.spec

      - name: Build GhostDrive Agents
        run: pyinstaller --noconfirm --clean GhostDriveAgents.spec

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Builds
          path: |
            dist/GhostDrive.exe
            dist/GhostDriveAgents.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Mac App (GhostDrive)
        run: pyinstaller --noconfirm --clean GhostDrive.spec

      - name: Build Mac App (Agents)
        run: pyinstaller --noconfirm --clean GhostDriveAgents.spec

      - name: Upload Mac Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Builds
          path: |
            dist/GhostDrive.app
            dist/GhostDriveAgents.app

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Binary (GhostDrive)
        run: pyinstaller --noconfirm --clean GhostDrive.spec

      - name: Build Linux Binary (Agents)
        run: pyinstaller --noconfirm --clean GhostDriveAgents.spec

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Builds
          path: |
            dist/GhostDrive
            dist/GhostDriveAgents
