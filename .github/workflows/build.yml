name: Build GhostDrive & Agents

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: |
          pyinstaller --noconfirm --clean GhostDrive.spec
          pyinstaller --noconfirm --clean GhostDriveAgents.spec

      - name: Compress into Windows Folder
        run: |
          New-Item -ItemType Directory -Force -Path Windows/GhostDrive
          New-Item -ItemType Directory -Force -Path Windows/GhostDriveAgents
          Copy-Item -Recurse -Force dist/GhostDrive/* Windows/GhostDrive/
          Copy-Item -Recurse -Force dist/GhostDriveAgents/* Windows/GhostDriveAgents/
          
          Compress-Archive -Path Windows -DestinationPath Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: Windows.zip

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip cache purge
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          
          # Force source compilation to bypass wheel CRC corruption errors
          pip install --no-cache-dir --no-binary=llama-cpp-python llama-cpp-python
          
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Purge Source Build Bloat from Site-Packages
        run: |
          python -c "
          import site, os, shutil
          for site_dir in site.getsitepackages():
              llama_dir = os.path.join(site_dir, 'llama_cpp')
              if os.path.exists(llama_dir):
                  print(f'Pruning build trash in {llama_dir}')
                  for root, dirs, files in os.walk(llama_dir):
                      for f in files:
                          if f.endswith(('.a', '.h', '.cpp', '.cmake', '.txt', '.o')):
                              try:
                                  os.remove(os.path.join(root, f))
                              except:
                                  pass
                      for d in dirs:
                          if d in ('CMakeFiles', 'include', 'src', 'ggml-src', 'build'):
                              shutil.rmtree(os.path.join(root, d), ignore_errors=True)
          "

      - name: Build Mac
        run: |
          pyinstaller --noconfirm --clean GhostDrive.spec
          pyinstaller --noconfirm --clean GhostDriveAgents.spec

      - name: Audit Bundle Size & Heavy Files
        run: |
          echo "=== Top 25 Largest Files/Folders Inside GhostDrive.app ==="
          du -h -d 4 dist/GhostDrive.app | sort -hr | head -n 25
          
          echo "=== Top 25 Largest Files/Folders Inside GhostDriveAgents.app ==="
          du -h -d 4 dist/GhostDriveAgents.app | sort -hr | head -n 25

      - name: Thin Binaries and Strip Bloat
        run: |
          echo "Thinning fat binaries to arm64 only using lipo..."
          for app in dist/GhostDrive.app dist/GhostDriveAgents.app; do
            find "$app" -type f \( -name "*.dylib" -o -name "*.so" -o -perm +111 \) | while read -r file; do
              if lipo -info "$file" 2>/dev/null | grep -q "Architectures in the fat file"; then
                lipo -thin arm64 "$file" -output "$file" 2>/dev/null || true
              fi
            done
          done

          echo "Stripping remaining debug symbols..."
          find dist/GhostDrive.app -name "*.dylib" -exec strip -x {} \; 2>/dev/null || true
          find dist/GhostDrive.app -name "*.so" -exec strip -x {} \; 2>/dev/null || true
          find dist/GhostDriveAgents.app -name "*.dylib" -exec strip -x {} \; 2>/dev/null || true
          find dist/GhostDriveAgents.app -name "*.so" -exec strip -x {} \; 2>/dev/null || true

          echo "Removing heavy unused framework assets..."
          rm -rf dist/GhostDrive.app/Contents/Resources/PySide6/translations
          rm -rf dist/GhostDriveAgents.app/Contents/Resources/PySide6/translations

      - name: Compress into Mac Folder
        run: |
          # Purge unused byte-code and cache junk
          find dist/GhostDrive.app -name "*.pyc" -delete
          find dist/GhostDrive.app -name "__pycache__" -type d -exec rm -rf {} +
          find dist/GhostDriveAgents.app -name "*.pyc" -delete
          find dist/GhostDriveAgents.app -name "__pycache__" -type d -exec rm -rf {} +
          
          # Stage into a clean 'Mac' folder
          mkdir -p Mac
          cp -R dist/GhostDrive.app Mac/
          cp -R dist/GhostDriveAgents.app Mac/
          
          # Compress archive with maximum compression
          zip -9 -r Mac.zip Mac

      - uses: actions/upload-artifact@v4
        with:
          name: Mac
          path: Mac.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller --noconfirm --clean GhostDrive.spec
          pyinstaller --noconfirm --clean GhostDriveAgents.spec

      - name: Compress into Linux Folder
        run: |
          mkdir -p Linux/GhostDrive
          mkdir -p Linux/GhostDriveAgents
          cp -r dist/GhostDrive/* Linux/GhostDrive/
          cp -r dist/GhostDriveAgents/* Linux/GhostDriveAgents/
          
          tar -czvf Linux.tar.gz Linux

      - uses: actions/upload-artifact@v4
        with:
          name: Linux
          path: Linux.tar.gz
