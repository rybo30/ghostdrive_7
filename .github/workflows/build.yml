name: Build GhostDrive & Agents

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: |
          pyinstaller --noconfirm --clean GhostDrive.spec
          pyinstaller --noconfirm --clean GhostDriveAgents.spec

      - name: Compress
        run: |
          Compress-Archive -Path dist/GhostDrive -DestinationPath GhostDrive-Windows.zip
          Compress-Archive -Path dist/GhostDriveAgents -DestinationPath GhostDriveAgents-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GhostDrive-Windows
          path: GhostDrive-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GhostDriveAgents-Windows
          path: GhostDriveAgents-Windows.zip

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip cache purge
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          
          # Compile llama-cpp-python from source on Mac to bypass wheel zip/CRC corruption errors
          pip install --no-cache-dir --no-binary=llama-cpp-python llama-cpp-python
          
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Slim down site-packages (Purge source build junk)
        run: |
          python -c "
          import site, os
          for site_dir in site.getsitepackages():
              llama_dir = os.path.join(site_dir, 'llama_cpp')
              if os.path.exists(llama_dir):
                  print(f'Cleaning build artifacts in {llama_dir}')
                  for root, dirs, files in os.walk(llama_dir, topdown=False):
                      for f in files:
                          if f.endswith(('.o', '.a', '.h', '.cpp', '.txt', '.cmake', '.ninja')) or 'CMakeFiles' in root:
                              try:
                                  os.remove(os.path.join(root, f))
                              except Exception:
                                  pass
                      for d in dirs:
                          if d in ('CMakeFiles', 'include', 'src', 'ggml-src'):
                              try:
                                  import shutil
                                  shutil.rmtree(os.path.join(root, d), ignore_errors=True)
                              except Exception:
                                  pass
          "

      - name: Build Mac
        run: |
          pyinstaller --noconfirm --clean GhostDrive.spec
          pyinstaller --noconfirm --clean GhostDriveAgents.spec

      - name: Compress
        run: |
          # Purge unused byte-code and cache junk from the built app bundles
          find dist/GhostDrive.app -name "*.pyc" -delete
          find dist/GhostDrive.app -name "__pycache__" -type d -exec rm -rf {} +
          find dist/GhostDriveAgents.app -name "*.pyc" -delete
          find dist/GhostDriveAgents.app -name "__pycache__" -type d -exec rm -rf {} +
          
          # Use maximum compression level (-9) for the macOS zip archives
          zip -9 -r GhostDrive-macOS.zip dist/GhostDrive.app
          zip -9 -r GhostDriveAgents-macOS.zip dist/GhostDriveAgents.app

      - uses: actions/upload-artifact@v4
        with:
          name: GhostDrive-macOS
          path: GhostDrive-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GhostDriveAgents-macOS
          path: GhostDriveAgents-macOS.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller --noconfirm --clean GhostDrive.spec
          pyinstaller --noconfirm --clean GhostDriveAgents.spec

      - name: Compress
        run: |
          tar -czvf GhostDrive-Linux.tar.gz -C dist GhostDrive
          tar -czvf GhostDriveAgents-Linux.tar.gz -C dist GhostDriveAgents

      - uses: actions/upload-artifact@v4
        with:
          name: GhostDrive-Linux
          path: GhostDrive-Linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: GhostDriveAgents-Linux
          path: GhostDriveAgents-Linux.tar.gz
