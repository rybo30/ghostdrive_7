name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen   # no display on CI runners
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml

      # Qt's GUI libraries need these shared libs on a bare Ubuntu runner
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3

      # Only what the test suite imports. The full requirements.txt pulls in
      # torch, llama-cpp-python and whisper (several GB), which the tests don't need.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest cryptography requests psutil PySide6-Essentials

      - name: Run tests
        run: python -m pytest -v
